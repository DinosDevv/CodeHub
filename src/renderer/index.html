<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lowtide</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <!--
      Boot splash: plain HTML/CSS so it paints on the very first frame, before
      any JavaScript runs. src/renderer/src/lib/boot.ts drains it away once the
      app has rendered underneath. Colors mirror the tokens in assets/main.css.
    -->
    <style>
      html,
      body {
        margin: 0;
        background: #08121c;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        overflow: hidden;
        background: #08121c;
        cursor: pointer;
        transition: opacity 0.9s ease 0.35s;
      }
      #boot .moon {
        position: absolute;
        top: 10%;
        right: 13%;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgb(242 212 155 / 0.32) 0%,
          rgb(242 212 155 / 0.12) 38%,
          transparent 70%
        );
        opacity: 0;
        animation: boot-fade 1.6s ease 0.1s forwards;
      }
      #boot .water {
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        height: 0;
        animation: boot-rise 1.5s cubic-bezier(0.45, 0, 0.2, 1) forwards;
        transition: transform 1.1s cubic-bezier(0.55, 0, 0.7, 0.3);
      }
      #boot .fill {
        position: absolute;
        inset: 34px 0 0;
        background: linear-gradient(to bottom, rgb(27 74 107 / 0.75), rgb(27 74 107 / 0.95));
      }
      #boot .wave {
        position: absolute;
        left: 0;
        top: 0;
        width: 200%;
        height: 40px;
      }
      #boot .wave svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      #boot .wave.a {
        animation: boot-slide 3.2s linear infinite;
      }
      #boot .wave.b {
        top: 8px;
        animation: boot-slide 4.6s linear infinite reverse;
      }
      #boot .mark {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #e6eef2;
        transition:
          opacity 0.6s ease,
          transform 0.9s ease;
      }
      #boot .mark svg {
        width: 64px;
        height: 64px;
        color: #63d2c0;
        filter: drop-shadow(0 0 14px rgb(99 210 192 / 0.55));
      }
      #boot .mark path {
        stroke-dasharray: 26;
        stroke-dashoffset: 26;
        animation: boot-draw 0.9s ease forwards;
      }
      #boot .mark path:nth-child(2) {
        animation-delay: 0.18s;
      }
      #boot .mark path:nth-child(3) {
        animation-delay: 0.36s;
      }
      #boot .name {
        font-family: 'Fraunces Variable', Georgia, serif;
        font-variation-settings:
          'SOFT' 100,
          'WONK' 1;
        font-size: 44px;
        font-weight: 600;
        letter-spacing: -0.01em;
        opacity: 0;
        transform: translateY(8px);
        animation: boot-in 0.9s ease 0.55s forwards;
      }
      #boot .tagline {
        font-family: 'Nunito Variable', 'Segoe UI', system-ui, sans-serif;
        font-size: 14px;
        color: #87a2b6;
        opacity: 0;
        animation: boot-fade 0.9s ease 0.9s forwards;
      }

      /* drain: the water falls away, the mark drifts up, everything fades */
      #boot.out {
        opacity: 0;
        pointer-events: none;
      }
      #boot.out .water {
        transform: translateY(105%);
      }
      #boot.out .mark {
        opacity: 0;
        transform: translateY(-14px);
      }

      @keyframes boot-rise {
        to {
          height: 34vh;
        }
      }
      @keyframes boot-slide {
        to {
          transform: translateX(-50%);
        }
      }
      @keyframes boot-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes boot-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes boot-fade {
        to {
          opacity: 1;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot *,
        #boot {
          animation-duration: 1ms !important;
          animation-delay: 0s !important;
          transition-duration: 0.3s !important;
          transition-delay: 0s !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="boot" aria-hidden="true">
      <div class="moon"></div>
      <div class="water">
        <div class="wave a">
          <svg viewBox="0 0 1600 40" preserveAspectRatio="none">
            <path
              d="M0 20 Q100 0 200 20 T400 20 T600 20 T800 20 T1000 20 T1200 20 T1400 20 T1600 20 V40 H0 Z"
              fill="rgb(27 74 107 / 0.55)"
            />
          </svg>
        </div>
        <div class="wave b">
          <svg viewBox="0 0 1600 40" preserveAspectRatio="none">
            <path
              d="M0 20 Q100 0 200 20 T400 20 T600 20 T800 20 T1000 20 T1200 20 T1400 20 T1600 20 V40 H0 Z"
              fill="rgb(99 210 192 / 0.22)"
            />
          </svg>
        </div>
        <div class="fill"></div>
      </div>
      <div class="mark">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M2 6c.6.5 1.2 1 2.5 1C7 7 7 5 9.5 5c2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"
          />
          <path
            d="M2 12c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"
          />
          <path
            d="M2 18c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"
          />
        </svg>
        <div class="name">lowtide</div>
        <div class="tagline">code with the tide</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
